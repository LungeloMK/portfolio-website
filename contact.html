<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — LungeloMK</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>LungeloMK</h1>
        <p class="tagline">Software developer • Frontend &amp; Tools</p>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="resume.html">Resume</a>
        <a href="projects.html">Projects</a>
        <a href="https://github.com/LungeloMK" class="external" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="contact-section">
      <h2>Contact</h2>
      <div class="contact-card">
        <form id="contact-form" class="contact-form" action="#" method="post" novalidate>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit" class="button">Send message</button>
          <p id="form-status" class="form-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 LungeloMK</p>
  </footer>

  <script>
  window.FORMSPREE_ENDPOINT = 'https://formspree.io/f/xblzpeqo';
    window.BACKEND_API = null;
  </script>
  <script src="scripts/contact.js" defer></script>
</body>
</html>
